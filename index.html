<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SG-SST JMA en Obra</title>
<meta name="theme-color" content="#134680">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SG-SST JMA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}#syncchip span{display:inline!important}#syncchip{padding:4px 10px!important;font-family:inherit}</style>
<script>window.SGSST_PROD=true</script>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Layout: app de campo a una columna sobre blanco (identidad J.M.A), barra superior con logotipo, pasos con botones grandes y barra de acción inferior.
   Tema único claro por decisión de marca: el manual de J.M.A define solo fondo blanco y se lee mejor a pleno sol en obra. */
:root{
  color-scheme:light;
  --azul:#134680; --rojo:#d51631; --amarillo:#f6b312; --verde:#45a82d;
  --negro:#000000; --blanco:#ffffff; --gris-texto:#414141;
  --tinte-amarillo:#fef8ec; --tinte-verde:#f0f5ee; --tinte-rosa:#f9eef2;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f5f7fa; --line:#d9dee6;
  --fg:var(--negro); --muted:var(--gris-texto);
  --font-sans:Ubuntu,"Segoe UI",system-ui,sans-serif;
  --radius-sm:4px; --radius-md:8px; --radius-pill:999px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blanco)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blanco);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;min-height:60px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{height:40px;width:auto;flex:none}
.brand .ph{height:40px;padding:0 10px;border:1px dashed var(--line);border-radius:var(--radius-sm);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}
.brand .t{min-width:0;border-left:1px solid var(--line);padding-left:12px}
.brand b{font-size:15px;font-weight:700;color:var(--azul);display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net{font-size:12px;font-weight:500;padding:4px 10px;border-radius:var(--radius-pill);background:var(--tinte-verde);white-space:nowrap;display:flex;align-items:center;gap:6px}
.net i{width:8px;height:8px;border-radius:50%;background:var(--verde)}
.net.off{background:var(--tinte-amarillo)}
.net.off i{background:var(--amarillo)}
.iconbtn{background:transparent;border:0;color:var(--azul);padding:8px;border-radius:var(--radius-md);font-size:14px;font-weight:500}
@media (max-width:420px){.brand .t{display:none}.net span{display:none}.net{padding:6px}}

main{padding-block:20px 128px;position:relative}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:700}
h1{font-size:24px;line-height:32px;color:var(--azul)}
h2{font-size:14px;line-height:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--azul);font-weight:700}
h3{font-size:18px;line-height:26px;font-weight:500}
.eyebrow{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.code{font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:.02em}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:var(--radius-pill);border:1.5px solid var(--azul);background:var(--blanco);color:var(--azul);font-weight:500;font-size:16px;text-align:center}
.btn.primary{background:var(--azul);color:var(--blanco)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{min-height:40px;padding:0 16px;font-size:14px}
.link{background:none;border:0;color:var(--azul);font-weight:500;padding:6px 0;text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* círculos de tinte (eco de los tres pilares) */
.tints{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.tints i{position:absolute;border-radius:50%}
.tints .a{width:360px;height:360px;background:var(--tinte-amarillo);right:-140px;top:-90px}
.tints .b{width:240px;height:240px;background:var(--tinte-verde);left:-120px;top:280px}

/* ingreso */
.login{max-width:420px;margin:16px auto 0}
.login .logo-big{display:flex;justify-content:center;padding-block:8px 4px}
.login .logo-big img{height:120px;width:auto}
.demo-hint{font-size:14px;line-height:20px;background:var(--tinte-amarillo);border-radius:var(--radius-md);padding:12px}

/* campos */
label.f,.f{display:flex;flex-direction:column;gap:8px;font-weight:500;font-size:14px;min-width:0}
.req::after{content:" *";color:var(--rojo)}
.in{width:100%;min-height:50px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);font-size:16px}
textarea.in{min-height:88px;resize:vertical}
select.in{appearance:auto}
.in:focus{border-color:var(--azul);outline:none;box-shadow:0 0 0 2px var(--azul)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.seg{display:flex;border:1.5px solid var(--azul);border-radius:var(--radius-pill);overflow:hidden}
.seg button{flex:1;min-height:48px;border:0;background:transparent;font-weight:500;font-size:15px;color:var(--azul)}
.seg button+button{border-left:1.5px solid var(--azul)}
.seg button[aria-pressed="true"]{background:var(--azul);color:var(--blanco)}

/* inicio */
.newgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.newgrid{grid-template-columns:1fr}}
.newcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--blanco);border:1.5px solid var(--azul);border-radius:var(--radius-md);padding:16px;min-width:0}
.newcard .plus{width:44px;height:44px;border-radius:50%;background:var(--azul);color:var(--blanco);display:grid;place-items:center;font-size:26px;font-weight:500;flex:none;line-height:1}
.newcard.ats .plus{background:var(--rojo)}
.newcard b{font-size:16px;line-height:22px;display:block;color:var(--azul)}
.newcard .code{font-size:12px;color:var(--muted)}
.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mod{background:var(--surface-2);border-radius:var(--radius-md);padding:12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.mod b{font-size:14px;line-height:20px;font-weight:500}
.mod .code{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:var(--radius-pill);white-space:nowrap}
.pill.borrador{background:var(--surface-2);color:var(--gris-texto);border:1px solid var(--line)}
.pill.abierto,.pill.vigente{background:var(--amarillo);color:var(--negro)}
.pill.cerrado{background:var(--verde);color:var(--negro)}
.pill.ej{background:var(--tinte-rosa);color:var(--gris-texto)}
.pill.tipo{background:var(--azul);color:var(--blanco)}
.pill.tipo.ats{background:var(--rojo)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--blanco);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px}
.pitem .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pitem .main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pitem .sub{font-size:13px;color:var(--muted)}
.pitem .chev{color:var(--azul);font-size:22px}
.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

/* pasos */
.stephead{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:var(--radius-pill);background:var(--line)}
.progress i.done{background:var(--azul)}
.progress i.cur{background:var(--amarillo)}
.saved{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.saved::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verde)}

/* preguntas */
.items{display:flex;flex-direction:column;gap:8px}
.item{background:var(--blanco);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;gap:12px;border-left-width:6px}
.item.v-si{border-left-color:var(--verde)}
.item.v-no{border-left-color:var(--rojo);background:var(--tinte-rosa)}
.item.v-na{border-left-color:var(--gris-texto)}
.item p{margin:0;font-weight:500}
.new{font-size:11px;font-weight:500;color:var(--azul);background:var(--tinte-amarillo);border-radius:var(--radius-sm);padding:2px 6px;margin-left:6px;white-space:nowrap}
.tag-cond{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--rojo)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri button{min-height:52px;border-radius:var(--radius-pill);border:1.5px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px}
.tri button[data-v="si"][aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--negro)}
.tri button[data-v="no"][aria-pressed="true"]{background:var(--rojo);border-color:var(--rojo);color:var(--blanco)}
.tri button[data-v="na"][aria-pressed="true"]{background:var(--gris-texto);border-color:var(--gris-texto);color:var(--blanco)}
.obs{font-size:14px;min-height:44px}
.no-msg{font-size:14px;line-height:20px;color:var(--rojo);font-weight:500;margin:0}
.allsi{display:flex;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:var(--radius-pill);border:1.5px solid var(--line);background:var(--blanco);font-weight:500;text-align:left}
.chip[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:var(--blanco)}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}

/* matriz de peligros */
.etapa{background:var(--blanco);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;gap:12px}
.etapa .eh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.etapa .num{width:28px;height:28px;border-radius:50%;background:var(--azul);color:var(--blanco);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.etapa textarea.in{min-height:64px}
.lib{background:var(--tinte-amarillo);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:12px}

/* firmas */
.sigbox{min-height:110px;border:2px dashed var(--line);border-radius:var(--radius-md);background:var(--surface-2);display:grid;place-items:center;width:100%;color:var(--azul);font-weight:500;padding:6px}
.sigbox img{max-height:96px}
.sigbox.has{border-style:solid;border-color:var(--verde);background:var(--blanco)}
.decl{font-size:14px;line-height:20px;background:var(--surface-2);border-radius:var(--radius-md);padding:12px;margin:0}
.worker{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.worker:first-of-type{border-top:0;padding-top:0}
.whead{display:flex;justify-content:space-between;align-items:center}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{min-height:56px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.day.today{border-color:var(--azul)}
.day.done{background:var(--verde);border-color:var(--verde);color:var(--negro)}
.day:disabled{opacity:.35;cursor:not-allowed}

/* revisión */
.issue{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--radius-md);background:var(--tinte-rosa);color:var(--fg);font-size:14px;line-height:20px;border:0;text-align:left;width:100%}
.issue b{color:var(--rojo)}
.okbox{padding:16px;border-radius:var(--radius-md);background:var(--tinte-verde);font-weight:500}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tally div{background:var(--surface-2);border-radius:var(--radius-md);padding:12px 4px;font-size:14px}
.tally b{display:block;font-size:28px;line-height:32px;font-variant-numeric:tabular-nums}

/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--blanco);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;gap:8px;padding-block:10px}
.bar .btn{flex:1}

/* firma a pantalla completa */
.modal{position:fixed;inset:0;z-index:20;background:var(--blanco);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));gap:12px}
.modal canvas{flex:1;width:100%;background:var(--blanco);border:2px solid var(--azul);border-radius:var(--radius-md);touch-action:none;min-height:200px}
.modal .row .btn{flex:1}

/* registro (vista del PDF) */
.doc{background:var(--blanco);color:var(--negro);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;font-size:12px;line-height:1.35}
.doc table{width:100%;border-collapse:collapse}
.doc td,.doc th{border:1px solid #8a8f96;padding:4px 6px;vertical-align:top;text-align:left}
.doc th{background:var(--azul);color:var(--blanco);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.doc .hdr td{text-align:center;vertical-align:middle}
.doc .hdr img{max-height:56px;width:auto}
.doc .ttl{font-weight:700;font-size:13px}
.doc .sec{margin-top:10px}
.doc .c{text-align:center;width:36px;font-weight:700}
.doc .no{color:var(--rojo)}
.doc img{max-height:44px}
.doc .dsig img{max-height:30px}
.docwrap{overflow-x:auto}
.docwrap .doc{min-width:600px}
.note{font-size:14px;line-height:20px;border-left:4px solid var(--azul);background:var(--surface-2);padding:12px;border-radius:0 var(--radius-md) var(--radius-md) 0;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--azul);color:var(--blanco);padding:10px 18px;border-radius:var(--radius-pill);font-weight:500;z-index:30;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo img{width:96px;height:72px;object-fit:cover;border-radius:var(--radius-md);border:1px solid var(--line)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:1px solid var(--line);background:var(--tinte-verde);border-radius:var(--radius-pill);padding:8px 14px;font-size:14px;text-align:left}
/* inspecciones y equipos */
.pill.apto{background:var(--verde);color:var(--negro)}
.pill.fuera{background:var(--amarillo);color:var(--negro)}
.pill.baja{background:var(--rojo);color:var(--blanco)}
.pill.venc{background:var(--tinte-rosa);color:var(--rojo);border:1px solid var(--rojo)}
.pill.prox{background:var(--tinte-amarillo);color:var(--gris-texto);border:1px solid var(--amarillo)}
.pill.cat{background:var(--surface-2);color:var(--azul);border:1px solid var(--line)}
.eqitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--blanco);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px}
.eqitem .thumb{width:56px;height:56px;border-radius:var(--radius-md);background:var(--surface-2);object-fit:cover;flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:500;text-align:center;overflow:hidden}
.eqitem .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.eqitem .main b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqitem .code{font-size:13px;color:var(--azul)}
.search{display:flex;gap:8px}
.search .in{flex:1}
.hv{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:start}
@media (max-width:480px){.hv{grid-template-columns:1fr}}
.hv .ph{width:100%;aspect-ratio:1;max-width:100%;border-radius:var(--radius-md);object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.qrwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox{background:var(--blanco);padding:8px;border:1px solid var(--line);border-radius:var(--radius-md);width:148px;height:148px;flex:none}
.qrbox img,.qrbox canvas{width:130px!important;height:130px!important}
.hist{display:flex;flex-direction:column;gap:8px}
.hist button{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--surface-2);border:0;border-radius:var(--radius-md);padding:12px;text-align:left;width:100%}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border-radius:var(--radius-md);padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--line);text-align:left;border-left:0;border-right:0;border-bottom:0}
.kpi b{font-size:30px;line-height:36px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;line-height:18px;color:var(--gris-texto)}
.kpi.k-ok{border-top-color:var(--verde)}.kpi.k-warn{border-top-color:var(--amarillo)}.kpi.k-bad{border-top-color:var(--rojo)}.kpi.k-az{border-top-color:var(--azul)}
.barcat{display:flex;flex-direction:column;gap:10px}
.barcat .r{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.barcat .track{display:flex;height:14px;border-radius:var(--radius-pill);overflow:hidden;background:var(--surface-2)}
.barcat .track i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--gris-texto)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:block}
.result{border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:8px}
.result.ok{background:var(--tinte-verde);border-left:6px solid var(--verde)}
.result.bad{background:var(--tinte-rosa);border-left:6px solid var(--rojo)}
.result b{font-size:18px}
.tri.cnc button[data-v="c"][aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--negro)}
.tri.cnc button[data-v="nc"][aria-pressed="true"]{background:var(--rojo);border-color:var(--rojo);color:var(--blanco)}
.tri.cnc button[data-v="na"][aria-pressed="true"]{background:var(--gris-texto);border-color:var(--gris-texto);color:var(--blanco)}
.item.v-c{border-left-color:var(--verde)}

const ACCESS=[['andamio','Andamio'],['escalera','Escalera'],['canasta','Elevador / canasta']];

/* ---------- contenido: FT-SST-094 Análisis de seguridad en el trabajo (ATS) ---------- */
const PROCS=[['civil','Construcción civil general'],['mant','Mantenimiento rutinario'],['quim','Manejo de químicos'],['izaje','Izaje de cargas'],['loto','Bloqueo eléctrico / mecánico (LOTO)'],['alturas','Trabajo en alturas'],['confinado','Espacios confinados'],['excav','Excavaciones / zanjas'],['caliente','Trabajo en caliente'],['otro','Otro procedimiento']];
const ATS_GEN=[

  '¿Se evaluaron las condiciones de trabajo (ruido, espacio, iluminación, polvo)?',

const ATS_COND={
  alturas:['Alturas',['¿Se evaluaron andamios, accesos o líneas de vida (Res. 4272/2021)?','¿Los andamios o equipos de elevación están certificados?',{t:'¿Se diligenció el permiso de trabajo en alturas FT-SST-091?',n:' '}]],
  caliente:['Trabajo en caliente',['¿Se cuenta con equipo de extinción de incendios a la mano?','¿El extintor está cargado y vigente?',{t:'¿Se diligenció el permiso de trabajo en caliente FT-SST-111?',n:' '}]],
  confinado:['Espacio confinado',[{t:'¿Se diligenció el permiso FT-SST-115 y se midió la atmósfera antes de ingresar?',n:' '},{t:'¿Hay vigía permanente en la entrada y plan de rescate?',n:' '}]],
  excav:['Excavaciones',[{t:'¿Se identificaron redes subterráneas (eléctricas, gas, acueducto) antes de excavar?',n:' '},{t:'¿Se diligenció la lista FT-SST-110 y el permiso FT-SST-116?',n:' '}]],
  loto:['Energías peligrosas',[{t:'¿Se aplicó bloqueo y etiquetado y se verificó energía cero?',n:' '},{t:'¿Se diligenció el permiso de energías peligrosas FT-SST-117?',n:' '}]],
  izaje:['Izaje de cargas',[{t:'¿El operador y el aparejador están certificados?',n:' '},{t:'¿Se inspeccionaron aparejos y se conoce el peso de la carga?',n:' '}]],
  quim:['Químicos',[{t:'¿Se cuenta con las fichas de datos de seguridad (FDS) y el rotulado SGA?',n:' '}]]
};
const GTC=['Condiciones de seguridad','Físico','Químico','Biológico','Biomecánico','Psicosocial','Fenómenos naturales'];
const LIB={
 'Armado y desarme de andamio':[['Transporte y alistamiento de cuerpos de andamio','Biomecánico','Sobreesfuerzo por levantamiento de cargas: lesiones lumbares','Levantar entre dos personas, técnica de levantamiento seguro, máximo 25 kg por persona'],['Armado de cuerpos y plataformas','Condiciones de seguridad','Caída de distinto nivel: fracturas, muerte','Permiso FT-SST-091, arnés anclado a línea de vida independiente, coordinador presente'],['Instalación de crucetas, rodapiés y barandas','Condiciones de seguridad','Caída de objetos: golpes a personal abajo','Demarcar área inferior, herramientas amarradas, casco con barbuquejo']],
 'Excavación manual':[['Localización y replanteo','Condiciones de seguridad','Contacto con redes enterradas: electrocución','Consultar planos de redes, sondeos manuales, señalización'],['Excavación con pala y barra','Biomecánico','Posturas forzadas y movimientos repetitivos: lesiones osteomusculares','Pausas activas, rotación de tareas, herramienta en buen estado'],['Profundización mayor a 1,5 m','Condiciones de seguridad','Derrumbe de paredes: atrapamiento','Entibado o talud, escalera de acceso, material retirado a 60 cm del borde']],
 'Fundida de concreto':[['Preparación y transporte de mezcla','Químico','Contacto con cemento: dermatitis, quemaduras químicas','Guantes de nitrilo, botas de caucho, gafas, lavado de manos'],['Vaciado en placa o columna','Condiciones de seguridad','Caída al mismo nivel por superficies irregulares','Orden y aseo, pasarelas, iluminación adecuada'],['Vibrado del concreto','Físico','Vibración y ruido: lesiones vasculares, hipoacusia','Protección auditiva, rotación del operador, equipo con mantenimiento']],
 'Corte con pulidora':[['Inspección de la herramienta','Condiciones de seguridad','Herramienta defectuosa: cortes, contacto eléctrico','Inspección preuso FT-SST-057, guarda instalada, disco adecuado'],['Corte de material','Condiciones de seguridad','Proyección de partículas y rotura de disco: lesiones oculares y cortes','Careta y gafas, guantes anticorte, posición fuera de la línea del disco'],['Corte continuo','Físico','Ruido: hipoacusia','Protección auditiva tipo copa, delimitar área']],
 'Soldadura eléctrica':[['Ubicación del equipo','Condiciones de seguridad','Contacto eléctrico indirecto: quemaduras, electrocución','Cables sin empalmes, conexión a tierra, equipo en área seca'],['Soldadura','Físico','Radiación no ionizante: lesiones oculares y de piel','Careta con filtro, peto, mangas y guantes de carnaza, biombos'],['Soldadura cerca de material combustible','Condiciones de seguridad','Incendio por chispas','Permiso FT-SST-111, extintor a la mano, retirar combustibles, vigía de fuego']],
 'Instalación eléctrica y conexión de tableros':[['Desenergización del circuito','Condiciones de seguridad','Contacto eléctrico directo: electrocución','Bloqueo y etiquetado (LOTO), verificar ausencia de tensión, permiso FT-SST-117'],['Conexión y peinado de cables','Condiciones de seguridad','Arco eléctrico: quemaduras','Herramienta aislada, EPP dieléctrico, personal calificado'],['Pruebas de energización','Condiciones de seguridad','Energización inesperada','Comunicación entre cuadrillas, retiro de candados solo por quien los instaló']],
 'Mampostería y pañete':[['Transporte de bloques y mezcla','Biomecánico','Manipulación de cargas: lesiones lumbares','Uso de carretilla, cargas compartidas, técnica de levantamiento'],['Levante de muro sobre andamio','Condiciones de seguridad','Caída de distinto nivel','Andamio certificado, barandas, arnés si supera 2 m sin protección colectiva'],['Aplicación de pañete','Químico','Contacto con mezcla: irritación de piel y ojos','Guantes, gafas, ropa de manga larga']],
 'Cargue y descargue de materiales':[['Recepción del vehículo','Condiciones de seguridad','Atropellamiento por maniobras del vehículo','Señalero, zona demarcada, vehículo apagado y frenado'],['Descargue manual','Biomecánico','Sobreesfuerzo: lesiones lumbares','Máximo 25 kg por persona, ayudas mecánicas, pausas'],['Almacenamiento','Condiciones de seguridad','Caída de materiales apilados: golpes','Arrume estable y a máximo 1,5 m, pasillos despejados']],
 'Pintura de fachada':[['Preparación de superficie','Físico','Material particulado: afección respiratoria','Respirador con filtro, humectación de superficie'],['Aplicación desde andamio o silla','Condiciones de seguridad','Caída de distinto nivel','Permiso FT-SST-091, arnés y línea de vida, coordinador presente'],['Manejo de pinturas y solventes','Químico','Inhalación de vapores: intoxicación','Respirador para vapores orgánicos, FDS disponible, ventilación']]
};
const ATS_STEPS=['Datos de la tarea','Procedimientos','Verificación','Peligros y controles','Personal','Aprobación','Revisión'];
const CODES={alturas:{code:'FT-SST-091',name:'Permiso de trabajo en alturas',title:'FORMATO PERMISO DE TRABAJO EN ALTURAS',dir:'PPCCA'},ats:{code:'FT-SST-094',name:'Análisis de seguridad en el trabajo (ATS)',title:'FORMATO DE ANÁLISIS DE SEGURIDAD EN EL TRABAJO',dir:'PPCCA'}};
const USERS=[{cedula:'1000000001',pin:'1234',nombre:'Usuario de prueba',rol:'SST'}];
const keyOf=(s,i)=>s+'_'+i;
const txt=it=>typeof it==='string'?it:it.t;

/* ---------- estado y guardado en el equipo ---------- */
const LS='sgsst-jma-v1';
let S=load()||seed();
S.permits.forEach(p=>{p.tipo=p.tipo||'alturas'});
S.seqs=S.seqs||{alturas:S.seq||1,ats:0};
if(!PROD&&!S.permits.some(p=>p.tipo==='ats')) S.permits.push(seedAts());
let ui={view:S.user?'home':'login',pid:null,step:0};
let savedAt=null;
function load(){try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));savedAt=new Date();const el=document.getElementById('savedat');if(el)el.textContent=stamp()}catch(e){}}
function stamp(){return savedAt?'Guardado en este equipo · '+savedAt.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}):'Se guarda solo mientras escribes'}
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function today(){return iso(new Date())}
function addDays(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)}
function uid(){return Math.random().toString(36).slice(2,9)}
function blankAlt(n){return{id:'p'+Date.now(),tipo:'alturas',consecutivo:n,status:'borrador',creado:new Date().toISOString(),step:0,
  gen:{fecha:today(),hora:new Date().toTimeString().slice(0,5),inicio:'',fin:'',empresa:'J.M.A',area:'',tipo:'',personas:'',desc:'',herr:'',altura:'',foto:''},
  checks:{},access:[],firmas:{},trabajadores:[{nombre:'',cedula:'',ss:'',firma:''}],cierre:{}}}
function blankAts(n){const t=today();return{id:'a'+Date.now(),tipo:'ats',consecutivo:n,status:'borrador',creado:new Date().toISOString(),step:0,
  gen:{obra:'',especialidad:'',actividad:'',inicio:t,fin:addDays(t,6),hora:new Date().toTimeString().slice(0,5),supervisor:'',empresa:'J.M.A'},
  procs:[],otro:'',checks:{},etapas:[],workers:[{id:uid(),nombre:'',cedula:'',cargo:''}],asis:{},firmas:{},cierre:{}}}
function seed(){
  if(PROD)return{user:null,seqs:{alturas:0,ats:0},permits:[]};
  const p=blankAlt(1);p.id='ejemplo';p.ejemplo=true;p.step=2;
  Object.assign(p.gen,{inicio:'07:30',fin:'16:30',area:'Torre 2 · fachada norte, piso 6',tipo:'rutinario',personas:'2',desc:'Instalación de ventanería en fachada desde andamio certificado. Anclaje a línea de vida vertical independiente.',herr:'Taladro percutor, nivel, pistola de silicona, eslingas de posicionamiento',altura:'16'});
  ALT.entorno.items.forEach((_,i)=>p.checks[keyOf('entorno',i)]={v:i===5?'na':'si'});
  return{user:null,seqs:{alturas:1,ats:0},permits:[p]};
}
function seedAts(){
  S.seqs.ats=(S.seqs.ats||0)+1;
  const a=blankAts(S.seqs.ats);a.id='ejemplo-ats';a.ejemplo=true;a.step=3;
  Object.assign(a.gen,{obra:'Edificio Mirador · Torre 2',especialidad:'Civil',actividad:'Fundida de placa piso 7',supervisor:'Residente de obra'});
  a.procs=['civil','alturas'];
  ATS_GEN.forEach((_,i)=>a.checks[keyOf('g',i)]={v:'si'});
  a.etapas=LIB['Fundida de concreto'].map(e=>({id:uid(),etapa:e[0],clase:e[1],riesgo:e[2],control:e[3]}));
  return a;
}
const P=()=>S.permits.find(p=>p.id===ui.pid);
/* firmas registradas por cédula: cada persona firma una vez y luego reutiliza su firma */
function regGet(c){c=String(c||'').trim();return c?(S.firmasReg||{})[c]:null}
function regSet(c,u){c=String(c||'').trim();if(!c||!u)return;S.firmasReg=S.firmasReg||{};S.firmasReg[c]=u}
const C=()=>CODES[P().tipo];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>String(n).padStart(4,'0');
function numOf(p){if(!PROD)return num(p.consecutivo);return p.numero?num(p.numero):(ui.__pdf?'{{NUMERO}}':'por asignar')}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function net(){const on=navigator.onLine;const n=$('#net');n.classList.toggle('off',!on);n.querySelector('span').textContent=on?'En línea':'Sin señal · guardando en el equipo'}
addEventListener('online',net);addEventListener('offline',net);
const keep=fn=>{const y=scrollY;fn&&fn();render();scrollTo(0,y)};
const dayLabel=s=>{const d=new Date(s+'T12:00');return['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()]+' '+d.getDate()};
function weekDays(p){const out=[];let d=p.gen.inicio;for(let i=0;i<7&&d<=p.gen.fin;i++){out.push(d);d=addDays(d,1)}return out}

/* ---------- render ---------- */
function render(){
  net();
  $('#logo-top').innerHTML=logoImg(LOGO_H,'J.M.A Consultoría, Ingeniería & Gestión','Logo J.M.A');
  $('#logout').hidden=!S.user;
  $('#who').textContent=S.user?S.user.nombre+' · '+S.user.rol:'Permisos e inspecciones en obra';
  const app=$('#app'),bar=$('#bar'),bi=$('#barin');bar.hidden=true;
  const v=ui.view;
  if(v==='login')app.innerHTML=vLogin();
  else if(v==='home')app.innerHTML=vHome();
  else if(v==='wizard'){app.innerHTML=P().tipo==='ats'?vAts():vAlt();bar.hidden=false;bi.innerHTML=barWizard()}
  else if(v==='cierre'){app.innerHTML=vCierre();bar.hidden=false;bi.innerHTML=`<button class="btn" data-act="doc">Volver</button><button class="btn primary" data-act="close-permit" ${cierreOk()?'':'disabled'}>Cerrar permiso</button>`}
  else if(v==='asis'){app.innerHTML=vAsis();bar.hidden=false;bi.innerHTML=`<button class="btn" data-act="doc">Ver registro</button><button class="btn primary" data-act="home">Listo</button>`}
  else if(v==='cierre-ats'){app.innerHTML=vCierreAts();bar.hidden=false;bi.innerHTML=`<button class="btn" data-act="doc">Volver</button><button class="btn primary" data-act="close-ats" ${P().cierre.firma?'':'disabled'}>Cerrar ATS</button>`}
  else if(v==='doc'){app.innerHTML=vDoc();bar.hidden=false;bi.innerHTML=`<button class="btn" data-act="home">Volver al inicio</button>`}
  else if(typeof renderQ==='function')renderQ(v,app,bar,bi);
  if(!ui.keepScroll)window.scrollTo(0,0);ui.keepScroll=false;
}

    <div class="logo-big">${logoImg(LOGO_V,'J.M.A Consultoría, Ingeniería & Gestión','Logo J.M.A')}</div>
    <div><div class="eyebrow">Sistema de Gestión de la Seguridad y Salud en el Trabajo</div><h1>Ingresa con tu cédula</h1></div>
    <form class="card" id="loginf">
      <label class="f">Número de cédula<input class="in" id="lc" inputmode="numeric" autocomplete="username" required></label>
      <label class="f">PIN de 4 dígitos<input class="in" id="lp" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" required></label>
      <p class="no-msg" id="lerr" hidden>La cédula o el PIN no coinciden. Revisa e intenta de nuevo.</p>

    </form></div>`;
}

function vHome(){
  const ps=[...S.permits].sort((a,b)=>b.creado.localeCompare(a.creado));
  const lab={borrador:'Borrador',abierto:'Abierto',vigente:'Vigente',cerrado:'Cerrado'};
  const sub=p=>p.tipo==='ats'?`N.° ${numOf(p)} · semana ${esc(p.gen.inicio)} a ${esc(p.gen.fin)}`:`N.° ${numOf(p)} · ${esc(p.gen.fecha)}${p.gen.altura?' · '+esc(p.gen.altura)+' m':''}`;
  const name=p=>p.tipo==='ats'?(p.gen.actividad||'ATS sin actividad'):(p.gen.area||'Sin lugar definido');
  const vig=ps.filter(p=>p.tipo==='ats'&&p.status==='vigente');
  return `<div class="tints"><i class="a"></i><i class="b"></i></div>
    <div class="stack" style="margin-bottom:24px">

const altSecs=p=>['entorno','verif','epp',...p.access.filter(a=>a!=='ninguno')];
function reviewAlt(){
  const p=P(),g=p.gen,out=[];
  const req={fecha:'la fecha',inicio:'la hora de inicio',fin:'la hora de terminación',empresa:'la empresa ejecutora',area:'el lugar',tipo:'el tipo de trabajo',personas:'el número de personas',altura:'la altura',desc:'la descripción de la tarea'};
  const miss=Object.keys(req).filter(k=>!String(g[k]||'').trim());
  if(miss.length)out.push({step:0,m:'Datos de la tarea: falta '+miss.map(k=>req[k]).join(', ')+'.'});
  const stepOf={entorno:1,verif:2,epp:3,andamio:4,escalera:4,canasta:4};
  altSecs(p).forEach(s=>{let empty=0,no=[];ALT[s].items.forEach((it,i)=>{const v=(p.checks[keyOf(s,i)]||{}).v;if(!v)empty++;if(v==='no')no.push(txt(it))});
    if(empty)out.push({step:stepOf[s],m:`${ALT[s].t}: ${empty} pregunta(s) sin responder.`});
    no.forEach(t=>out.push({step:stepOf[s],m:`Respondido NO: "${t}". No se puede iniciar hasta corregirlo.`}))});
  if(!p.access.length)out.push({step:4,m:'Sistema de acceso: elige cuál se usará o marca Ninguno.'});
  [['autoriza','la persona que autoriza'],['emergencias','el responsable del plan de emergencias'],['coordinador','el coordinador de trabajo en alturas']].forEach(([r,l])=>{const f=p.firmas[r]||{};if(!f.nombre||!f.cedula||!f.img)out.push({step:5,m:`Falta nombre, cédula o firma de ${l}.`})});
  p.trabajadores.forEach((t,i)=>{if(!t.nombre||!t.cedula||!t.firma||!t.ss)out.push({step:5,m:`Trabajador ${i+1}: faltan datos, verificación de seguridad social o firma.`});else if(t.ss==='no')out.push({step:5,m:`Trabajador ${i+1} sin seguridad social verificada: no puede ejecutar la tarea.`})});
  if(+g.personas&&+g.personas!==p.trabajadores.length)out.push({step:5,m:`El número de trabajadores (${p.trabajadores.length}) no coincide con las personas ejecutoras (${g.personas}).`});
  return out;
}

function daysRow(p,w,days,t){

function reviewAts(){
  const p=P(),g=p.gen,out=[];
  const req={obra:'la obra',especialidad:'la especialidad',actividad:'la actividad',inicio:'el inicio de semana',fin:'el fin de semana',supervisor:'el supervisor'};
  const miss=Object.keys(req).filter(k=>!String(g[k]||'').trim());
  if(miss.length)out.push({step:0,m:'Datos de la tarea: falta '+miss.map(k=>req[k]).join(', ')+'.'});
  if(g.fin<g.inicio)out.push({step:0,m:'El fin de la semana es anterior al inicio.'});
  if(!p.procs.length)out.push({step:1,m:'Elige al menos un procedimiento.'});
  if(p.procs.includes('otro')&&!p.otro.trim())out.push({step:1,m:'Escribe cuál es el otro procedimiento.'});
  const all=[...ATS_GEN.map((t,i)=>[keyOf('g',i),t])];p.procs.forEach(pr=>{if(ATS_COND[pr])ATS_COND[pr][1].forEach((t,i)=>all.push([keyOf('c'+pr,i),txt(t)]))});
  const empty=all.filter(([k])=>!(p.checks[k]||{}).v).length;
  if(empty)out.push({step:2,m:`Verificación: ${empty} pregunta(s) sin responder.`});
  all.filter(([k])=>(p.checks[k]||{}).v==='no').forEach(([,t])=>out.push({step:2,m:`Respondido NO: "${t}". No se puede iniciar hasta corregirlo.`}));
  if(!p.etapas.length)out.push({step:3,m:'Agrega al menos una etapa con sus peligros y controles.'});
  p.etapas.forEach((e,i)=>{if(!e.etapa||!e.clase||!e.riesgo||!e.control)out.push({step:3,m:`Etapa ${i+1}: completa etapa, clasificación, riesgo y controles.`})});
  p.workers.forEach((w,i)=>{if(!w.nombre||!w.cedula)out.push({step:4,m:`Trabajador ${i+1}: falta nombre o cédula.`})});
  if(!p.workers.some(w=>Object.keys(p.asis[w.id]||{}).length))out.push({step:4,m:'Al menos un trabajador debe firmar la asistencia del primer día.'});
  [['elabora','quien elabora'],['aprueba','quien aprueba']].forEach(([r,l])=>{const f=p.firmas[r]||{};if(!f.nombre||!f.cedula||!f.img)out.push({step:5,m:`Falta nombre, cédula o firma de ${l}.`})});
  return out;
}

function openSign(role){
  const p=P();let label,setter;
  if(role.startsWith('asis:')){const[,wid,d]=role.split(':');const w=p.workers.find(x=>x.id===wid);
    if(!w.nombre){toast('Escribe primero el nombre del trabajador');return}
    label=`${w.nombre} · ${dayLabel(d)}`;setter=u=>{p.asis[wid]=p.asis[wid]||{};p.asis[wid][d]=u}}
  else if(role==='cierre'){label='Firma de cierre';setter=u=>p.cierre.firma=u}
  else if(role[0]==='w'&&/^w\d+$/.test(role)){label='Trabajador '+(+role.slice(1)+1);setter=u=>p.trabajadores[+role.slice(1)].firma=u}
  else{label={autoriza:'Persona que autoriza',emergencias:'Responsable plan de emergencias',coordinador:'Coordinador de trabajo en alturas',elabora:'Quien elabora',aprueba:'Quien aprueba'}[role];setter=u=>{p.firmas[role]=p.firmas[role]||{};p.firmas[role].img=u}}
  let ced='';
  if(role.startsWith('asis:'))ced=(p.workers.find(x=>x.id===role.split(':')[1])||{}).cedula;
  else if(role==='cierre')ced=(p.firmas[p.tipo==='ats'?'aprueba':'coordinador']||{}).cedula;
  else if(/^w\d+$/.test(role))ced=p.trabajadores[+role.slice(1)].cedula;
  else ced=(p.firmas[role]||{}).cedula;
  signModal(label,ced,setter);
}
function signModal(label,ced,setter){
  const reg=regGet(ced);
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Firma${ced?' · C.C. '+esc(ced):''}</div><h1 style="font-size:20px;line-height:28px">${esc(label)}</h1></div><span class="muted" style="font-size:13px">Gira el equipo para tener más espacio</span></div>${reg?`<div class="card" style="gap:8px;padding:12px"><span class="eyebrow">Firma registrada</span><img src="${reg}" alt="Firma registrada" style="max-height:80px;align-self:flex-start"><button class="btn primary" id="sreg">Firmar con mi firma registrada</button><span class="muted" style="font-size:13px">O dibuja una nueva abajo; la nueva queda como registrada.</span></div>`:''}<canvas aria-label="Área de firma"></canvas>${ced?'':'<p class="muted" style="margin:0;font-size:13px">Escribe la cédula antes de firmar para que la firma quede registrada.</p>'}<div class="row"><button class="btn" id="sx">Cancelar</button><button class="btn" id="sc">Borrar</button><button class="btn primary" id="sok">Guardar firma</button></div>`;
  document.body.appendChild(m);
  const cv=m.querySelector('canvas'),ctx=cv.getContext('2d');let drawing=false,has=false,last=null;
  function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#134680';ctx.fillStyle='#134680';has=false}
  size();const ro=new ResizeObserver(size);ro.observe(cv);
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener('pointerdown',e=>{drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],1.2,0,7);ctx.fill();has=true});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const q=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();last=q;has=true});
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drawing=false));
  const close=()=>{ro.disconnect();m.remove()};
  m.querySelector('#sx').onclick=close;
  m.querySelector('#sc').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);has=false};
  m.querySelector('#sok').onclick=()=>{if(!has){toast('Dibuja la firma antes de guardar');return}const u=cv.toDataURL('image/png');setter(u);regSet(ced,u);save();close();keep();toast(ced?'Firma guardada y registrada':'Firma guardada')};
  if(reg)m.querySelector('#sreg').onclick=()=>{setter(reg);save();close();keep();toast('Firmado con la firma registrada')};
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,p=P();
  if(a==='new'){const t=b.dataset.tipo;S.seqs[t]=(S.seqs[t]||0)+1;const np=t==='ats'?blankAts(S.seqs[t]):blankAlt(S.seqs[t]);S.permits.push(np);ui={view:'wizard',pid:np.id,step:0};save();render()}
  else if(a==='open'){ui.pid=b.dataset.id;const q=P();if(q.status==='borrador'){ui.view='wizard';ui.step=q.step||0}else ui.view='doc';render()}
  else if(a==='home'){ui.view='home';render()}
  else if(a==='doc'){ui.view='doc';render()}
  else if(a==='asis'){ui.pid=b.dataset.id||ui.pid;ui.view='asis';render()}
  else if(a==='next'){ui.step++;p.step=ui.step;save();render()}
  else if(a==='prev'){ui.step--;p.step=ui.step;save();render()}
  else if(a==='goto'){ui.step=+b.dataset.step;p.step=ui.step;render()}
  else if(a==='check')keep(()=>{const k=b.dataset.k;p.checks[k]=p.checks[k]||{};p.checks[k].v=b.dataset.v;save()});
  else if(a==='addobs'){const k=b.dataset.k;keep(()=>{p.checks[k]=p.checks[k]||{};p.checks[k].obs=''});const i=document.getElementById('obs-'+k);if(i)i.focus()}
  else if(a==='allsi')keep(()=>{const s=b.dataset.sec;ALT[s].items.forEach((_,i)=>{const k=keyOf(s,i);p.checks[k]=p.checks[k]||{};if(!p.checks[k].v)p.checks[k].v='si'});save();toast('Las pendientes quedaron en SÍ. Revisa cada una.')});
  else if(a==='allsi-ats')keep(()=>{const keys=ATS_GEN.map((_,i)=>keyOf('g',i)).concat(atsCondKeys(p));keys.forEach(k=>{p.checks[k]=p.checks[k]||{};if(!p.checks[k].v)p.checks[k].v='si'});save();toast('Las pendientes quedaron en SÍ. Revisa cada una.')});
  else if(a==='gen-seg')keep(()=>{p.gen.tipo=b.dataset.v;save()});
  else if(a==='access')keep(()=>{const v=b.dataset.v;if(v==='ninguno')p.access=p.access.includes('ninguno')?[]:['ninguno'];else{p.access=p.access.filter(x=>x!=='ninguno');p.access=p.access.includes(v)?p.access.filter(x=>x!==v):[...p.access,v]}save()});
  else if(a==='proc')keep(()=>{const v=b.dataset.v;p.procs=p.procs.includes(v)?p.procs.filter(x=>x!==v):[...p.procs,v];save()});
  else if(a==='sign')openSign(b.dataset.role);
  else if(a==='conexion'){ui.view='conexion';render()}
  else if(a==='myfirma')signModal('Mi firma · '+S.user.nombre,S.user.cedula,()=>{});
  else if(a==='addw')keep(()=>{p.trabajadores.push({nombre:'',cedula:'',ss:'',firma:''});save()});
  else if(a==='delw')keep(()=>{p.trabajadores.splice(+b.dataset.i,1);save()});
  else if(a==='wss')keep(()=>{p.trabajadores[+b.dataset.i].ss=b.dataset.v;save()});
  else if(a==='addaw')keep(()=>{p.workers.push({id:uid(),nombre:'',cedula:'',cargo:''});save()});
  else if(a==='delaw')keep(()=>{const w=p.workers.splice(+b.dataset.i,1)[0];delete p.asis[w.id];save()});
  else if(a==='addlib'){const k=$('#libsel').value;if(!k){toast('Elige una actividad de la lista');return}keep(()=>{LIB[k].forEach(x=>p.etapas.push({id:uid(),etapa:x[0],clase:x[1],riesgo:x[2],control:x[3]}));save()});toast(LIB[k].length+' etapas agregadas. Ajústalas a la obra.')}
  else if(a==='adde')keep(()=>{p.etapas.push({id:uid(),etapa:'',clase:'',riesgo:'',control:''});save()});
  else if(a==='dele')keep(()=>{p.etapas.splice(+b.dataset.i,1);save()});
  else if(a==='finish'){
    if(p.tipo==='ats'){if(reviewAts().length)return;p.status='vigente';save();ui.view='doc';render();toast('ATS aprobado y vigente esta semana')}
    else{if(reviewAlt().length)return;p.status='abierto';p.abierto=new Date().toISOString();save();ui.view='doc';render();toast('Permiso abierto y guardado')}}
  else if(a==='to-cierre'){ui.view='cierre';render()}
  else if(a==='to-cierre-ats'){ui.view='cierre-ats';render()}
  else if(a==='cierre')keep(()=>{p.cierre['c'+b.dataset.i]=b.dataset.v;if(CIERRE.every((_,i)=>p.cierre['c'+i]==='si')&&!p.cierre.obs)p.cierre.obs=OBS_OK;save()});
  else if(a==='ats-inc')keep(()=>{p.cierre.inc=b.dataset.v;if(b.dataset.v==='no'&&!p.cierre.obs)p.cierre.obs=OBS_OK;save()});

});
document.addEventListener('input',e=>{
  const t=e.target,p=P();if(!p)return;const d=t.dataset;
  if(d.gen)p.gen[d.gen]=t.value;
  else if(d.root)p[d.root]=t.value;
  else if(d.obs){p.checks[d.obs]=p.checks[d.obs]||{};p.checks[d.obs].obs=t.value}
  else if(d.sig){p.firmas[d.sig]=p.firmas[d.sig]||{};p.firmas[d.sig][d.field]=t.value}
  else if(d.w!==undefined)p.trabajadores[+d.w][d.field]=t.value;
  else if(d.aw!==undefined)p.workers[+d.aw][d.field]=t.value;
  else if(d.e!==undefined)p.etapas[+d.e][d.field]=t.value;
  else if(d.cierre)p.cierre[d.cierre]=t.value;
  else return;
  save();
});
document.addEventListener('change',e=>{
  const t=e.target,p=P();
  if(t.id==='g-altura'||t.id==='a-ini'){if(t.id==='a-ini'&&p.gen.inicio){p.gen.fin=addDays(p.gen.inicio,6);save()}keep()}
  if(t.id==='g-foto'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1000/img.width);c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);p.gen.foto=c.toDataURL('image/jpeg',.7);save();keep();toast('Foto agregada')};img.src=fr.result};fr.readAsDataURL(t.files[0])}
});
document.addEventListener('change',e=>{if(/^(fc-|wc-|aw-c-|iq-ic|iq-uc|pd-ced)/.test(e.target.id))keep()});
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginf')return;e.preventDefault();
  const c=$('#lc').value.trim(),pin=$('#lp').value.trim();let u;
  if(PROD){const h=await sha256(c+':'+pin);u=(S.usuarios||[]).find(x=>String(x.cedula)===c&&x.h===h)}
  else u=USERS.find(u=>u.cedula===c&&u.pin===pin);

  if(typeof fromHash==='function')fromHash();
});
$('#logout').onclick=()=>{S.user=null;save();ui={view:'login',pid:null,step:0};render()};
render();
</script>

/* --- descargas: en el prototipo usa el permiso del visor; en la app instalada, descarga normal del navegador --- */
async function getDL(){if(!PROD)return await window.claude?.use?.('downloads');return{save:async({filename,data})=>{const bl=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return{status:'saved'}}}}

const EQ=code=>S.equipos.find(e=>e.code===code);
const lastInsp=code=>S.insps.filter(i=>i.code===code&&!i.borrador).sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora))[0];
function nextDue(e){const l=lastInsp(e.code);return l?addDays(l.fecha,+e.frecuencia||30):null}
function dueState(e){if(e.estado==='baja')return null;const n=nextDue(e),t=today();if(!n)return{k:'venc',l:'Sin inspección'};if(n<t)return{k:'venc',l:'Vencida desde '+n};if(n<=addDays(t,7))return{k:'prox',l:'Vence '+n};return null}

      <label class="btn primary" for="qrfile">Tomar foto del QR</label><input type="file" id="qrfile" accept="image/*" capture="environment" hidden>

/* --- hoja de vida --- */
function vEquipo(){

  const d=dueState(e),l=lifeState(e),n=nextDue(e);
  return `<div class="stephead"><span class="eyebrow">Hoja de vida · ${CATS[tp.cat]}</span><h1>${esc(e.nombre||tp.n)}</h1>
    <div class="row"><span class="pill ${e.estado}">${RES[e.estado]}</span>${d?`<span class="pill ${d.k}">${esc(d.l)}</span>`:''}${l?`<span class="pill ${l.k}">${esc(l.l)}</span>`:''}${e.ejemplo?'<span class="pill ej">Ejemplo</span>':''}</div></div>
  <div class="stack">
    ${e.estado==='fuera'?'<p class="note" style="border-color:var(--amarillo)">Fuera de servicio: no se puede usar hasta repararlo y aprobar una nueva inspección.</p>':''}
    ${e.estado==='baja'?'<p class="note" style="border-color:var(--rojo)">Dado de baja: se retira de la obra y se inutiliza para que nadie lo vuelva a usar.</p>':''}
    <div class="card"><div class="hv">${e.foto?`<img class="ph" src="${e.foto}" alt="Foto del equipo">`:'<div class="ph">Sin foto de referencia</div>'}
      <dl class="kv"><dt>Código</dt><dd class="code">${e.code}</dd><dt>Tipo</dt><dd>${tp.n}</dd><dt>Marca</dt><dd>${esc(e.marca||'—')}</dd><dt>Modelo</dt><dd>${esc(e.modelo||'—')}</dd><dt>Serial / lote</dt><dd>${esc(e.serial||'—')}</dd><dt>Fabricación</dt><dd>${esc(e.fabricacion||'—')}</dd><dt>En servicio desde</dt><dd>${esc(e.servicio||'—')}</dd><dt>Fin de vida útil</dt><dd>${esc(e.vence||'No aplica')}</dd><dt>Obra</dt><dd>${esc(e.obra||'—')}</dd><dt>Responsable</dt><dd>${esc(e.responsable||'—')}</dd><dt>Inspeccionar cada</dt><dd>${esc(e.frecuencia)} días</dd><dt>Próxima inspección</dt><dd>${n||'Ahora'}</dd></dl></div>
      <button class="link" data-q="eqedit" style="align-self:flex-start">Editar datos del equipo</button></div>
    <div class="card"><h3>Código QR del equipo</h3><div class="qrwrap"><div class="qrbox" id="qrbox"></div><div class="stack" style="gap:8px;flex:1;min-width:180px"><p class="muted" style="margin:0;font-size:14px">Pégalo en el equipo con una etiqueta resistente. Al escanearlo con la cámara del celular, se abre esta hoja de vida.</p><button class="btn small" data-q="label">Descargar etiqueta (PNG)</button></div></div></div>
    <div class="card"><h3>Historial de inspecciones</h3>${hist.length?`<div class="hist">${hist.map(i=>`<button data-q="open-insp" data-id="${i.id}"><span><b style="font-weight:500">${i.fecha}</b> · ${i.tipo==='preuso'?'Preuso':'Periódica'}<br><span class="muted" style="font-size:13px">${esc(i.inspector.nombre||'')}${i.obs?' · '+esc(i.obs):''}</span></span><span class="pill ${i.resultado}">${RES[i.resultado]}</span></button>`).join('')}</div>`:'<p class="muted" style="margin:0">Todavía no tiene inspecciones.</p>'}</div>
  </div>`;
}
function qrText(code){return APP_URL+'#'+code}
function drawQR(){const b=document.getElementById('qrbox');if(!b)return;if(typeof QRCode==='undefined'){b.innerHTML='<span class="muted" style="font-size:12px">El QR necesita internet la primera vez</span>';return}b.innerHTML='';new QRCode(b,{text:qrText(ui.eq),width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}
async function downloadLabel(){
  const e=EQ(ui.eq);if(typeof QRCode==='undefined'){toast('Conéctate a internet para generar el QR');return}
  const tmp=document.createElement('div');new QRCode(tmp,{text:qrText(e.code),width:520,height:520,correctLevel:QRCode.CorrectLevel.M});
  const qc=tmp.querySelector('canvas');const W=700,H=900,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.strokeStyle='#134680';x.lineWidth=8;x.strokeRect(4,4,W-8,H-8);
  await new Promise(r=>{const lg=new Image();lg.onload=()=>{const h=90,w=lg.width*h/lg.height;x.drawImage(lg,(W-w)/2,30,w,h);r()};lg.onerror=r;lg.src=LOGO_H});
  x.drawImage(qc,90,140,520,520);
  x.fillStyle='#134680';x.font='700 56px Ubuntu, sans-serif';x.textAlign='center';x.fillText(e.code,W/2,730);
  x.fillStyle='#000';x.font='500 30px Ubuntu, sans-serif';x.fillText((e.nombre||TIPOS[e.tipo].n).slice(0,38),W/2,780);
  x.fillStyle='#414141';x.font='400 24px Ubuntu, sans-serif';x.fillText('SG-SST · Inspección FT-SST-057 · Escanéame antes de usar',W/2,840);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const dl=await getDL();
  if(!dl){toast('La descarga no está disponible en esta vista');return}
  try{await dl.save({filename:`Etiqueta-${e.code}.png`,data:blob});toast('Etiqueta descargada')}catch(err){if(err&&err.code!=='declined')toast('No se pudo descargar la etiqueta')}
}

/* --- registrar / editar equipo --- */

function inspResult(d){const tp=TIPOS[EQ(d.code).tipo];const nc=tp.items.some((_,i)=>(d.checks[i]||{}).v==='nc');if(!nc)return'apto';return tp.cat==='alturas'?'baja':(d.accion==='baja'?'baja':'fuera')}

      ${d.usuario.nombre?`<div class="card"><h3>Trabajador: ${esc(d.usuario.nombre)}</h3><button type="button" class="sigbox ${d.usuario.img?'has':''}" data-q="isign" data-who="usuario">${d.usuario.img?`<img src="${d.usuario.img}" alt="">`:'Toca para firmar'}</button></div>`:''}
      ${iss.length?`<div class="card"><h3>Falta resolver</h3>${iss.map(x=>`<button class="issue" data-q="igoto" data-step="${x.step}"><b>●</b><span>${esc(x.m)} <u>Ir al paso</u></span></button>`).join('')}</div>`:''}

  return `<div class="stephead">

function inspIssues(){
  const d=D(),tp=TIPOS[EQ(d.code).tipo],out=[];
  if(!d.tipo)out.push({step:0,m:'Elige el tipo de inspección.'});
  if(!d.fecha||!d.obra)out.push({step:0,m:'Falta la fecha o la obra.'});
  const empty=tp.items.filter((_,i)=>!(d.checks[i]||{}).v).length;if(empty)out.push({step:1,m:`${empty} punto(s) sin revisar.`});
  tp.items.forEach((t,i)=>{const c=d.checks[i]||{};if(c.v==='nc'&&!(c.obs||'').trim())out.push({step:1,m:`Describe el daño en: "${t}".`})});
  if(!d.foto)out.push({step:2,m:'Falta la foto del equipo.'});
  if(!d.inspector.nombre||!d.inspector.cedula||!d.inspector.img)out.push({step:3,m:'Falta nombre, cédula o firma del inspector.'});
  if(d.usuario.nombre&&!d.usuario.img)out.push({step:3,m:'Falta la firma del trabajador.'});
  return out;
}

  const aptos=act.filter(e=>e.estado==='apto'&&!(dueState(e)||{}).k);
  const month=today().slice(0,7),im=S.insps.filter(i=>i.fecha.slice(0,7)===month&&!i.borrador);

    <div class="card"><h3>Estado por categoría</h3>
      <div class="legend"><span><i style="background:var(--verde)"></i>Apto</span><span><i style="background:var(--amarillo)"></i>Fuera de servicio</span><span><i style="background:var(--rojo)"></i>Dado de baja</span></div>
      <div class="barcat">${rows.map(r=>`<div class="r"><span>${r.s}</span><div class="track" style="width:${r.t/max*100}%">${r.t?['apto','fuera','baja'].map(k=>r.c[k]?`<i style="width:${r.c[k]/r.t*100}%;background:var(--${k==='apto'?'verde':k==='fuera'?'amarillo':'rojo'})" title="${RES[k]}: ${r.c[k]}"></i>`:'').join(''):''}</div><b class="code">${r.t}</b></div>`).join('')}</div></div>
