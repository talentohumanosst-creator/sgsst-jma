async function downloadCSV(){
  const cols=['Código','Tipo','Categoría','Descripción','Marca','Modelo','Serial','Fabricación','En servicio','Fin vida útil','Obra','Responsable','Estado','Última inspección','Próxima inspección'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[cols.map(q).join(';'),...S.equipos.map(e=>{const l=lastInsp(e.code);return[e.code,TIPOS[e.tipo].n,CATS[TIPOS[e.tipo].cat],e.nombre,e.marca,e.modelo,e.serial,e.fabricacion,e.servicio,e.vence,e.obra,e.responsable,RES[e.estado],l?l.fecha:'',e.estado==='baja'?'':nextDue(e)||'Ahora'].map(q).join(';')})];
  const dl=await getDL();if(!dl){toast('La descarga no está disponible en esta vista');return}
  try{await dl.save({filename:`Inventario-equipos-${today()}.csv`,data:'﻿'+lines.join('\r\n')});toast('Inventario descargado')}catch(err){if(err&&err.code!=='declined')toast('No se pudo descargar')}
}

/* --- firma (reutiliza el panel de firma) --- */
function signTo(label,setter,ced){if(typeof signModal==='function')return signModal(label,ced,setter);
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div><div class="eyebrow">Firma</div><h1 style="font-size:20px;line-height:28px">${esc(label)}</h1></div><canvas aria-label="Área de firma"></canvas><div class="row"><button class="btn" id="sx">Cancelar</button><button class="btn" id="sc">Borrar</button><button class="btn primary" id="sok">Guardar firma</button></div>`;
  document.body.appendChild(m);const cv=m.querySelector('canvas'),ctx=cv.getContext('2d');let dr=false,has=false,last;
  const size=()=>{const r=cv.getBoundingClientRect(),dp=devicePixelRatio||1;cv.width=r.width*dp;cv.height=r.height*dp;ctx.setTransform(dp,0,0,dp,0,0);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.strokeStyle='#134680';ctx.fillStyle='#134680';has=false};
  size();const ro=new ResizeObserver(size);ro.observe(cv);const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{dr=true;last=pt(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],1.2,0,7);ctx.fill();has=true};
  cv.onpointermove=e=>{if(!dr)return;const q=pt(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...q);ctx.stroke();last=q};
  cv.onpointerup=cv.onpointercancel=()=>dr=false;
  const close=()=>{ro.disconnect();m.remove()};m.querySelector('#sx').onclick=close;m.querySelector('#sc').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);has=false};
  m.querySelector('#sok').onclick=()=>{if(!has){toast('Dibuja la firma antes de guardar');return}setter(cv.toDataURL('image/png'));save();close();keep();toast('Firma guardada')};
}

/* --- lectura de QR desde foto --- */
function decodeQR(file){
  if(typeof jsQR==='undefined'){toast('El lector de QR necesita internet la primera vez');return}
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,c.width,c.height);
    if(!r){toast('No se encontró un QR en la foto. Acércate y enfoca bien.');return}
    const code=(r.data.split('#')[1]||r.data).trim();if(EQ(code))openEq(code);else toast('El código '+code+' no está en el inventario')};img.src=fr.result};fr.readAsDataURL(file);
}
function openEq(code){ui.view='equipo';ui.eq=code;render()}

/* --- eventos del módulo --- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-q]');if(!b)return;const a=b.dataset.q;
  if(a==='equipos'){ui.view='equipos';render()}
  else if(a==='tablero'){ui.view='tablero';render()}
  else if(a==='equipo'){ui.view='equipo';render()}
  else if(a==='eqfilter'){ui.eqfilter=b.dataset.v;keep()}
  else if(a==='open-eq')openEq(b.dataset.code);
  else if(a==='eqnew'){ui.eqf={isNew:true,tipo:'',code:'',nombre:'',marca:'',modelo:'',serial:'',fabricacion:'',servicio:today(),vence:'',obra:'',responsable:'',frecuencia:30,foto:'',estado:'apto'};ui.view='eqform';render()}
  else if(a==='eqedit'){ui.eqf={...EQ(ui.eq),isNew:false};ui.view='eqform';render()}
  else if(a==='eqsave'){const f=ui.eqf;if(!f.tipo){toast('Elige el tipo de equipo');return}if(!(+f.frecuencia>0)){toast('Indica cada cuántos días se inspecciona');return}
    const{isNew,...data}=f;if(isNew){data.creado=today();S.equipos.push(data)}else Object.assign(EQ(f.code),data);save();ui.eq=f.code;ui.view='equipo';render();toast(isNew?'Equipo registrado con código '+f.code:'Datos guardados')}
  else if(a==='label')downloadLabel();
  else if(a==='csv')downloadCSV();
  else if(a==='inspnew'){const e=EQ(ui.eq);S.idraft={id:'i'+Date.now(),code:e.code,fecha:today(),hora:new Date().toTimeString().slice(0,5),tipo:'',obra:e.obra||'',checks:{},foto:'',accion:'',obs:'',inspector:{nombre:S.user?S.user.nombre:'',cedula:S.user?S.user.cedula:'',img:''},usuario:{nombre:'',cedula:'',img:''}};ui.step=0;ui.view='insp';save();render()}
  else if(a==='inext'){ui.step++;render()}
  else if(a==='iprev'){ui.step--;render()}
  else if(a==='igoto'){ui.step=+b.dataset.step;render()}
  else if(a==='itipo')keep(()=>{D().tipo=b.dataset.v;save()});
  else if(a==='icheck')keep(()=>{const d=D(),i=b.dataset.i;d.checks[i]=d.checks[i]||{};d.checks[i].v=b.dataset.v;save()});
  else if(a==='iallc')keep(()=>{const d=D();TIPOS[EQ(d.code).tipo].items.forEach((_,i)=>{d.checks[i]=d.checks[i]||{};if(!d.checks[i].v)d.checks[i].v='c'});save();toast('Los pendientes quedaron en C. Revisa cada uno.')});
  else if(a==='iacc')keep(()=>{D().accion=b.dataset.v;save()});
  else if(a==='isign'){const who=b.dataset.who,d=D();signTo(who==='inspector'?'Inspector':'Trabajador: '+d.usuario.nombre,u=>d[who].img=u,d[who].cedula)}
  else if(a==='isave'){const d=D();if(inspIssues().length)return;d.resultado=inspResult(d);if(d.resultado==='fuera')d.accion='mant';S.insps.push(d);const e=EQ(d.code);e.estado=d.resultado;S.idraft=null;save();ui.insp=d.id;ui.view='inspdoc';render();toast(d.resultado==='apto'?'Inspección guardada: equipo apto':'Inspección guardada: equipo '+RES[d.resultado].toLowerCase())}
  else if(a==='open-insp'){ui.insp=b.dataset.id;ui.view='inspdoc';render()}
});
document.addEventListener('input',ev=>{
  const t=ev.target,dd=t.dataset;
  if(t.id==='eqq'){ui.eqq=t.value;const pos=t.selectionStart;render();const n=$('#eqq');n.focus();n.setSelectionRange(pos,pos);return}
  if(dd.ef){ui.eqf[dd.ef]=t.value;return}
  const d=D();if(!d)return;
  if(dd.iq)d[dd.iq]=t.value;else if(dd.iqu)d.usuario[dd.iqu]=t.value;else if(dd.iqi)d.inspector[dd.iqi]=t.value;else if(dd.iobs){d.checks[dd.iobs].obs=t.value}else return;save();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='ef-tipo'){const f=ui.eqf;f.tipo=t.value;if(f.isNew&&f.tipo){f.code=nextCode(f.tipo);f.frecuencia=FREQ[TIPOS[f.tipo].cat];if(!f.nombre)f.nombre=TIPOS[f.tipo].n}keep()}
  if(t.id==='ef-foto'&&t.files[0])resizePhoto(t.files[0],u=>{ui.eqf.foto=u;keep()});
  if(t.id==='iq-foto'&&t.files[0])resizePhoto(t.files[0],u=>{D().foto=u;save();keep();toast('Foto agregada')});
  if(t.id==='qrfile'&&t.files[0])decodeQR(t.files[0]);
});
/* abrir la hoja de vida cuando se llega desde un QR (#JMA-XXX-000) */
function fromHash(){const c=decodeURIComponent(location.hash.slice(1));if(c&&EQ(c)&&S.user){openEq(c);return true}return false}
addEventListener('hashchange',fromHash);
if(!fromHash())render();
</script>

<script>
/* =================== Módulo: preoperacional de vehículos PESV · FT-SST-130 =================== */
const VTIPOS=['Camioneta','Automóvil','Campero','Camión','Volqueta','Motocicleta'];
const DOCS=[
  {k:'soat',l:'SOAT',h:'Vigente hasta'},
  {k:'rtm',l:'Revisión técnico-mecánica',h:'Vigente hasta (o exenta hasta, si es nuevo)'},
  {k:'poliza',l:'Póliza todo riesgo',h:'Vigente hasta (opcional)',opt:1},
  {k:'extintor',l:'Extintor',h:'Recarga vigente hasta'},
  {k:'botiquin',l:'Botiquín',h:'Última revisión (se revisa cada 6 meses)',rev:6}
];
const VGROUPS=[
  {k:'frenos',l:'Frenos',items:[['Frenos de pedal y de estacionamiento funcionan',1],['Nivel de líquido de frenos correcto',1]]},
  {k:'direccion',l:'Dirección',items:[['Dirección sin holgura y funciona bien',1]]},
  {k:'llantas',l:'Llantas',items:[['Llantas con labrado mínimo de 1,6 mm y sin cortaduras',1],['Pernos y tuercas completos y asegurados',1],['Llanta de repuesto en buen estado y con presión',0,1]]},
  {k:'luces',l:'Luces',items:[['Luces altas, bajas, de freno y reversa funcionan',1],['Direccionales y luces de parqueo funcionan',1]]},
  {k:'motor',l:'Motor y fluidos',items:[['Nivel de aceite de motor correcto',0],['Nivel de refrigerante correcto',0,1],['Sin fugas de aceite, refrigerante o combustible',1]]},
  {k:'seguridad',l:'Cabina y seguridad',items:[['Cinturones de seguridad con anclaje y en buen estado',1,1],['Vidrios y panorámico sin fisuras, buena visibilidad',1,1],['Espejos retrovisores en buen estado y ajustados',1],['Limpiabrisas funcionan y tienen líquido',0,1],['Pito funciona',1]]},
  {k:'kit',l:'Equipo de carretera',items:[['Kit de carretera completo (tacos, señales, gato, cruceta, herramienta)',0,1],['Casco y chaleco reflectivo del conductor (motocicleta)',1,2]]}
];
/* items: [texto, crítico, 1 = no aplica a moto · 2 = solo moto] */
const isMoto=v=>v.tipo==='Motocicleta';
const gItems=(v,g)=>g.items.map((it,i)=>({t:it[0],crit:!!it[1],k:g.k+'_'+i,skip:(it[2]===1&&isMoto(v))||(it[2]===2&&!isMoto(v))})).filter(x=>!x.skip);
function addMonths(s,n){const d=new Date(s+'T12:00');d.setMonth(d.getMonth()+n);return iso(d)}
function docDue(v,d){const val=v.docs[d.k];if(!val)return null;return d.rev?addMonths(val,d.rev):val}
function docState(v,d){const due=docDue(v,d),t=today();if(!due)return d.opt?{k:'na',l:'No registrado'}:{k:'venc',l:'Sin fecha registrada'};if(due<t)return{k:'venc',l:(d.rev?'Revisión vencida desde ':'Vencido desde ')+due};if(due<=addDays(t,30))return{k:'prox',l:'Vence '+due};return{k:'ok',l:(d.rev?'Próxima revisión ':'Vigente hasta ')+due}}
function licState(c){if(!c||!c.licVence)return{k:'venc',l:'Sin fecha de licencia'};const t=today();if(c.licVence<t)return{k:'venc',l:'Licencia vencida desde '+c.licVence};if(c.licVence<=addDays(t,30))return{k:'prox',l:'Licencia vence '+c.licVence};return{k:'ok',l:'Licencia vigente hasta '+c.licVence}}

/* --- datos de ejemplo --- */
if(!S.vehiculos&&PROD){S.vehiculos=[];S.conductores=[];S.preops=[];save()}
if(!S.vehiculos){const t=today(),d=n=>addDays(t,n);
  S.vehiculos=[
    {placa:'JMA123',tipo:'Camioneta',marca:'Toyota',linea:'Hilux 2.4',modelo:'2022',color:'Blanco',km:48210,estado:'operativo',docs:{soat:d(140),rtm:d(22),poliza:d(200),extintor:d(95),botiquin:d(-120)},ejemplo:true},
    {placa:'KLM456',tipo:'Automóvil',marca:'Renault',linea:'Logan',modelo:'2019',color:'Gris',km:91544,estado:'operativo',docs:{soat:d(-4),rtm:d(180),poliza:'',extintor:d(-10),botiquin:d(-200)},ejemplo:true},
    {placa:'ABC12F',tipo:'Motocicleta',marca:'Yamaha',linea:'XTZ 150',modelo:'2023',color:'Azul',km:12030,estado:'operativo',docs:{soat:d(300),rtm:d(400),poliza:'',extintor:'',botiquin:''},ejemplo:true}];
  S.conductores=[{cedula:'1000000001',nombre:'Usuario de prueba',cat:'C1',licVence:d(600),firma:''}];
  S.preops=[];save()}
S.preops=S.preops||[];S.conductores=S.conductores||[];S.conductores.forEach(c=>{if(c.firma&&!regGet(c.cedula))regSet(c.cedula,c.firma)});
const VEH=p=>S.vehiculos.find(v=>v.placa===p);
const COND=c=>S.conductores.find(x=>x.cedula===c);
const lastPre=p=>S.preops.filter(x=>x.placa===p).sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora))[0];
const doneToday=p=>S.preops.some(x=>x.placa===p&&x.fecha===today());
const vAlerts=v=>{const a=DOCS.map(d=>[d,docState(v,d)]).filter(([d,s])=>(s.k==='venc'&&!(d.k==='extintor'&&isMoto(v))&&!(d.k==='botiquin'&&isMoto(v)))||s.k==='prox');return a};

/* --- inicio --- */
function homeV(){
  const pend=S.vehiculos.filter(v=>!doneToday(v.placa)&&v.estado!=='inmovilizado').length;
  return `<button class="newcard" data-pv="lista" style="border-color:var(--verde)"><span class="plus" style="background:var(--verde);color:var(--negro)">${pend}</span><span><b>Preoperacional de vehículo</b><span class="code">FT-SST-130 · ${pend} vehículo(s) sin preoperacional hoy</span></span></button>`;
}

function renderV(v,app,bar,bi){
  if(v==='vlista'){app.innerHTML=vLista();bar.hidden=false;bi.innerHTML=`<button class="btn" data-act="home">Inicio</button><button class="btn primary" data-pv="vnew">+ Registrar vehículo</button>`}
  else if(v==='vform'){app.innerHTML=vForm();bar.hidden=false;bi.innerHTML=`<button class="btn" data-pv="lista">Cancelar</button><button class="btn primary" data-pv="vsave">Guardar vehículo</button>`}
  else if(v==='preop'){app.innerHTML=vPreop();bar.hidden=false;const st=ui.step;bi.innerHTML=`${st===0?'<button class="btn" data-pv="lista">Cancelar</button>':'<button class="btn" data-pv="pprev">Atrás</button>'}${st<3?'<button class="btn primary" data-pv="pnext">Siguiente</button>':`<button class="btn primary" data-pv="psave" ${preIssues().length?'disabled':''}>Guardar preoperacional</button>`}`}
  else if(v==='predoc'){app.innerHTML=vPreDoc();bar.hidden=false;bi.innerHTML=`<button class="btn" data-pv="lista">Vehículos</button><button class="btn primary" data-act="home">Inicio</button>`}
  else if(typeof renderS==='function')renderS(v,app,bar,bi);
}

/* --- lista de vehículos --- */
function vLista(){
  return `<div class="stephead"><span class="eyebrow">PESV · FT-SST-130</span><h1>¿Qué vehículo vas a inspeccionar?</h1><span class="muted">Las fechas de documentos, extintor y botiquín se guardan con el vehículo; solo las actualizas cuando cambian.</span></div>
  <div class="plist">${S.vehiculos.map(v=>{const al=vAlerts(v),l=lastPre(v.placa),hoy=doneToday(v.placa);return `<div class="card" style="gap:12px">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div><b class="code" style="font-size:22px;color:var(--azul);letter-spacing:.08em">${v.placa}</b><div class="muted" style="font-size:14px">${esc(v.tipo)} · ${esc(v.marca)} ${esc(v.linea)} ${esc(v.modelo)}</div></div>
      <div class="tags">${v.estado==='inmovilizado'?'<span class="pill baja">Inmovilizado</span>':hoy?'<span class="pill apto">Hecho hoy</span>':'<span class="pill borrador">Pendiente hoy</span>'}${v.ejemplo?'<span class="pill ej">Ejemplo</span>':''}</div></div>
    ${al.length?`<div class="row">${al.map(([d,s])=>`<span class="pill ${s.k}">${d.l}: ${esc(s.l)}</span>`).join('')}</div>`:''}
    <span class="muted" style="font-size:13px">${l?`Último: ${l.fecha} · ${esc(l.nombre)} · ${l.km.toLocaleString('es-CO')} km`:'Sin preoperacionales registrados'}</span>
    <div class="row"><button class="btn primary small" data-pv="pnew" data-placa="${v.placa}" style="flex:1">Hacer preoperacional</button><button class="btn small" data-pv="vedit" data-placa="${v.placa}">Datos y fechas</button></div>
    ${S.preops.some(x=>x.placa===v.placa)?`<div class="hist">${S.preops.filter(x=>x.placa===v.placa).sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora)).slice(0,3).map(x=>`<button data-pv="open-pre" data-id="${x.id}"><span>${x.fecha} ${x.hora} · ${esc(x.nombre)}</span><span class="pill ${x.resultado==='apto'?'apto':'baja'}">${x.resultado==='apto'?'Apto':'No apto'}</span></button>`).join('')}</div>`:''}
  </div>`}).join('')}</div>`;
}

/* --- registrar / editar vehículo --- */
function vForm(){const f=ui.vf;
  return `<div class="stephead"><span class="eyebrow">${f.isNew?'Nuevo vehículo':'Vehículo '+f.placa}</span><h1>Datos y fechas</h1></div>
  <div class="stack"><div class="card">
    <div class="grid2"><label class="f"><span class="req">Placa</span><input class="in" id="vf-placa" data-vf="placa" value="${esc(f.placa)}" ${f.isNew?'':'disabled'} style="text-transform:uppercase;letter-spacing:.08em;font-weight:500"></label>
    <label class="f"><span class="req">Tipo</span><select class="in" id="vf-tipo" data-vf="tipo">${VTIPOS.map(t=>`<option ${f.tipo===t?'selected':''}>${t}</option>`).join('')}</select></label>
    <label class="f">Marca<input class="in" id="vf-marca" data-vf="marca" value="${esc(f.marca)}"></label><label class="f">Línea<input class="in" id="vf-linea" data-vf="linea" value="${esc(f.linea)}"></label>
    <label class="f">Modelo (año)<input class="in" id="vf-modelo" inputmode="numeric" data-vf="modelo" value="${esc(f.modelo)}"></label><label class="f">Color<input class="in" id="vf-color" data-vf="color" value="${esc(f.color)}"></label>
    <label class="f">Kilometraje actual<input class="in" type="number" id="vf-km" data-vf="km" value="${esc(f.km)}"></label></div></div>
    <div class="card"><h3>Documentos y vigencias</h3>${DOCS.map(d=>`<label class="f">${d.l}${d.opt?'':' <span class="req"></span>'}<span class="muted" style="font-weight:400">${d.h}</span><input class="in" type="date" id="vf-${d.k}" data-vfd="${d.k}" value="${esc(f.docs[d.k]||'')}"></label>`).join('')}</div>
  </div>`}

/* --- preoperacional en 4 pasos --- */
const P_STEPS=['Vehículo y conductor','Documentos y vigencias','Revisión rápida','Resultado y firma'];
const PD=()=>S.pdraft;
function vPreop(){
  const d=PD(),v=VEH(d.placa),st=ui.step,c=COND(d.cedula);let body='';
  if(st===0){const lic=licState(c);
    body=`<div class="card">
      <div class="row" style="justify-content:space-between"><b class="code" style="font-size:22px;color:var(--azul);letter-spacing:.08em">${v.placa}</b><span class="muted">${esc(v.tipo)} · ${esc(v.marca)} ${esc(v.linea)}</span></div>
      <div class="grid2"><label class="f"><span class="req">Cédula del conductor</span><input class="in" id="pd-ced" inputmode="numeric" data-pd="cedula" value="${esc(d.cedula)}"></label>
      <label class="f"><span class="req">Nombre del conductor</span><input class="in" id="pd-nom" data-pd="nombre" value="${esc(d.nombre)}"></label></div>
      ${c?`<p class="decl">Conductor registrado. ${esc(lic.l)} · Categoría ${esc(c.cat||'—')}.</p>`:`<div class="grid2"><label class="f"><span class="req">Categoría de licencia</span><input class="in" id="pd-cat" data-pd="cat" value="${esc(d.cat)}" placeholder="B1, C1, A2…"></label><label class="f"><span class="req">Licencia vigente hasta</span><input class="in" type="date" id="pd-lic" data-pd="licVence" value="${esc(d.licVence)}"></label></div><p class="muted" style="margin:0;font-size:14px">Se guarda para las próximas veces.</p>`}
      <label class="f"><span class="req">Kilometraje actual</span><input class="in" type="number" inputmode="numeric" id="pd-km" data-pd="km" value="${esc(d.km)}"><span class="muted" style="font-weight:400">Último registrado: ${(+v.km||0).toLocaleString('es-CO')} km</span></label>
    </div>`}
  else if(st===1){
    body=`<p class="muted" style="margin:0 0 12px">Las fechas vienen del registro del vehículo. Si renovaste algo, toca "Actualizar".</p><div class="items">${DOCS.filter(dd=>!(isMoto(v)&&(dd.k==='extintor'||dd.k==='botiquin'))).map(dd=>{const s=docState(v,dd),ed=ui.pedit===dd.k;return `<div class="item ${s.k==='ok'?'v-c':s.k==='venc'?'v-nc':''}">
      <div class="row" style="justify-content:space-between"><p>${dd.l}</p><span class="pill ${s.k==='ok'?'apto':s.k==='venc'?'venc':s.k==='prox'?'prox':'borrador'}">${s.k==='ok'?'Al día':s.k==='venc'?'Vencido':s.k==='prox'?'Por vencer':'Opcional'}</span></div>
      <span style="font-size:14px">${esc(s.l)}</span>
      ${ed?`<label class="f">${dd.h}<input class="in" type="date" id="pe-${dd.k}" data-pe="${dd.k}" value="${esc(v.docs[dd.k]||'')}"></label><button class="btn small" data-pv="pedit-ok">Listo</button>`:`<div class="row">${dd.rev?`<button class="btn small" data-pv="botiquin-hoy">Lo revisé hoy</button>`:''}<button class="link" data-pv="pedit" data-k="${dd.k}">Actualizar</button></div>`}
    </div>`}).join('')}</div>`}
  else if(st===2){
    body=`<p class="muted" style="margin:0 0 12px">Revisa cada grupo. Si todo está bien, toca "Todo cumple". Si algo falla, toca ese punto para marcarlo como No cumple.</p><div class="stack">${VGROUPS.map(g=>{const its=gItems(v,g);if(!its.length)return'';const done=its.every(it=>d.checks[it.k]);const nc=its.filter(it=>d.checks[it.k]==='nc').length;return `<div class="card" style="gap:10px;border-left:6px solid ${nc?'var(--rojo)':done?'var(--verde)':'var(--line)'}">
      <div class="row" style="justify-content:space-between"><h3>${g.l}</h3>${done?`<span class="pill ${nc?'baja':'apto'}">${nc?nc+' no cumple':'Cumple'}</span>`:`<button class="btn small primary" data-pv="gok" data-g="${g.k}">Todo cumple</button>`}</div>
      <div class="chips" style="flex-direction:column;align-items:stretch">${its.map(it=>{const val=d.checks[it.k];return `<button class="chip" data-pv="tog" data-k="${it.k}" style="border-radius:var(--radius-md);text-align:left;${val==='nc'?'background:var(--rojo);border-color:var(--rojo);color:var(--blanco)':val==='c'?'border-color:var(--verde);background:var(--tinte-verde)':''}">${val==='nc'?'✗ ':val==='c'?'✓ ':''}${esc(it.t)}${it.crit?' <span class="tag-cond" style="color:inherit;opacity:.8">· crítico</span>':''}</button>${val==='nc'?`<input class="in obs" id="pobs-${it.k}" data-pobs="${it.k}" placeholder="¿Qué falla?" value="${esc(d.obsItems[it.k]||'')}">`:''}`}).join('')}</div></div>`}).join('')}</div>`}
  else if(st===3){const r=preResult(),iss=preIssues(),cd=COND(d.cedula);
    body=`<div class="stack"><div class="result ${r.apto?'ok':'bad'}"><span class="eyebrow">Resultado</span><b>${r.apto?'Apto para operar':'No apto: el vehículo queda inmovilizado'}</b>
      ${r.motivos.length?`<ul style="margin:0;padding-left:18px;font-size:14px">${r.motivos.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:'<span style="font-size:14px">Documentos al día y todos los puntos cumplen.</span>'}
      ${!r.apto?'<span style="font-size:14px">Avisa al responsable del PESV. El vehículo no sale hasta corregir y hacer un nuevo preoperacional.</span>':''}</div>
      ${r.hayNC?`<div class="card"><h3>Foto de la falla</h3><p class="muted" style="margin:0;font-size:14px">Obligatoria cuando algo no cumple.</p><div class="photo">${d.foto?`<img src="${d.foto}" alt="" style="width:160px;height:120px">`:''}<label class="btn ${d.foto?'small':'primary'}" for="pd-foto">${d.foto?'Cambiar foto':'Tomar foto'}</label><input id="pd-foto" type="file" accept="image/*" capture="environment" hidden></div></div>`:''}
      <label class="f">Observaciones<textarea class="in" id="pd-obs" data-pd="obs">${esc(d.obs)}</textarea></label>
      <div class="card"><h3>Firma del conductor</h3><p class="decl">Declaro que la información de esta inspección es verídica y que revisé el vehículo antes de operarlo.</p>
        ${regGet(d.cedula)&&!d.firma?`<button class="btn primary" data-pv="usefirma">Firmar con mi firma registrada</button>`:''}
        <button type="button" class="sigbox ${d.firma?'has':''}" data-pv="psign">${d.firma?`<img src="${d.firma}" alt="">`:'Toca para firmar'}</button>
</div>
      ${iss.length?`<div class="card"><h3>Falta resolver</h3>${iss.map(x=>`<button class="issue" data-pv="pgoto" data-step="${x.step}"><b>●</b><span>${esc(x.m)} <u>Ir al paso</u></span></button>`).join('')}</div>`:''}</div>`}
  return `<div class="stephead"><div class="row" style="justify-content:space-between"><span class="eyebrow">Paso ${st+1} de 4 · <span class="code">FT-SST-130</span></span><span class="code" style="color:var(--azul);letter-spacing:.08em">${v.placa}</span></div>
    <div class="progress">${P_STEPS.map((_,i)=>`<i class="${i<st?'done':i===st?'cur':''}"></i>`).join('')}</div><h1>${P_STEPS[st]}</h1><span class="saved" id="savedat">${stamp()}</span></div>${body}`;
}
function preResult(){
  const d=PD(),v=VEH(d.placa),motivos=[];let hayNC=false;
  DOCS.filter(dd=>!dd.opt&&!(isMoto(v)&&(dd.k==='extintor'||dd.k==='botiquin'))).forEach(dd=>{if(docState(v,dd).k==='venc')motivos.push(dd.l+': '+docState(v,dd).l)});
  const c=COND(d.cedula)||{licVence:d.licVence};if(licState(c).k==='venc')motivos.push(licState(c).l);
  VGROUPS.forEach(g=>gItems(v,g).forEach(it=>{if(d.checks[it.k]==='nc'){hayNC=true;if(it.crit)motivos.push('Crítico no cumple: '+it.t)}}));
  return{apto:!motivos.length,motivos,hayNC};
}
function preIssues(){
  const d=PD(),v=VEH(d.placa),out=[];
  if(!d.cedula||!d.nombre)out.push({step:0,m:'Falta la cédula o el nombre del conductor.'});
  if(!COND(d.cedula)&&(!d.cat||!d.licVence))out.push({step:0,m:'Falta la categoría o la vigencia de la licencia.'});
  if(!(+d.km>0))out.push({step:0,m:'Falta el kilometraje.'});else if(+d.km<(+v.km||0))out.push({step:0,m:'El kilometraje es menor que el último registrado.'});
  const pend=VGROUPS.filter(g=>gItems(v,g).some(it=>!d.checks[it.k])).map(g=>g.l);if(pend.length)out.push({step:2,m:'Grupos sin revisar: '+pend.join(', ')+'.'});
  VGROUPS.forEach(g=>gItems(v,g).forEach(it=>{if(d.checks[it.k]==='nc'&&!(d.obsItems[it.k]||'').trim())out.push({step:2,m:`Describe la falla: "${it.t}".`})}));
  if(preResult().hayNC&&!d.foto)out.push({step:3,m:'Falta la foto de la falla.'});
  if(!d.firma)out.push({step:3,m:'Falta la firma del conductor.'});
  return out;
}
function vPreDoc(){
  const x=S.preops.find(p=>p.id===ui.pre),v=VEH(x.placa);
  return `<div class="stack"><div class="stephead"><span class="eyebrow">Preoperacional · ${x.fecha} ${x.hora}</span><h1>Registro FT-SST-130</h1><div class="row"><span class="pill ${x.resultado==='apto'?'apto':'baja'}">${x.resultado==='apto'?'Apto para operar':'No apto · inmovilizado'}</span></div></div>
  <p class="note">Así queda el PDF que se archiva en <span class="code">SG-SST JMA / PESV / FT-SST-130 / ${x.placa}</span>.</p>
  <div class="docwrap"><div class="doc">
    <table class="hdr"><tr><td rowspan="3" style="width:24%">${LOGO_H?`<img src="${LOGO_H}" alt="J.M.A">`:'<small>Logo J.M.A</small>'}</td><td rowspan="3"><div style="font-size:10px">Sistema de Gestión de la Seguridad y Salud en el Trabajo · PESV</div><div class="ttl">FORMATO INSPECCIÓN DIARIA DE VEHÍCULOS</div></td><td style="width:24%">Código: <b>FT-SST-130</b></td></tr><tr><td>Versión: 001</td></tr><tr><td>Placa: ${x.placa}</td></tr></table>
    <table class="sec"><tr><th colspan="4">1. Vehículo y conductor</th></tr>
      <tr><td><b>Placa</b> ${x.placa}</td><td><b>Tipo</b> ${esc(v.tipo)}</td><td><b>Marca / línea</b> ${esc(v.marca)} ${esc(v.linea)}</td><td><b>Km</b> ${(+x.km).toLocaleString('es-CO')}</td></tr>
      <tr><td colspan="2"><b>Conductor</b> ${esc(x.nombre)} · C.C. ${esc(x.cedula)}</td><td colspan="2"><b>Licencia</b> ${esc(x.lic)}</td></tr></table>
    <table class="sec"><tr><th>2. Documentos y vigencias</th><th>Fecha</th><th class="c">Estado</th></tr>${x.docsSnap.map(s=>`<tr><td>${s.l}</td><td>${esc(s.f||'—')}</td><td class="c ${s.k==='venc'?'no':''}">${s.k==='venc'?'NC':s.k==='na'?'N/A':'C'}</td></tr>`).join('')}</table>
    <table class="sec"><tr><th>3. Revisión</th><th class="c">C</th><th class="c">NC</th><th>Observación</th></tr>${VGROUPS.map(g=>gItems(v,g).map(it=>`<tr><td>${esc(g.l)} · ${esc(it.t)}</td><td class="c">${x.checks[it.k]==='c'?'X':''}</td><td class="c no">${x.checks[it.k]==='nc'?'X':''}</td><td>${esc(x.obsItems[it.k]||'')}</td></tr>`).join('')).join('')}</table>
    <table class="sec"><tr><th colspan="2">4. Dictamen y firma</th></tr><tr><td><b>${x.resultado==='apto'?'APTO PARA OPERAR':'NO APTO PARA OPERAR'}</b><br>${x.motivos.map(esc).join('<br>')}<br>${esc(x.obs)}</td><td>${x.foto?`<img src="${x.foto}" alt="" style="max-height:100px">`:''}</td></tr><tr><td colspan="2"><b>Conductor</b> ${esc(x.nombre)}<br><img src="${x.firma}" alt=""></td></tr></table>
  </div></div></div>`;
}

/* --- tablero: vehículos --- */
function tabVeh(){
  const t=today();const alerts=[];S.vehiculos.forEach(v=>vAlerts(v).forEach(([d,s])=>alerts.push({v,d,s})));
  S.conductores.forEach(c=>{const l=licState(c);if(l.k!=='ok')alerts.push({c,s:l})});
  const sin=S.vehiculos.filter(v=>!doneToday(v.placa)&&v.estado!=='inmovilizado'),inm=S.vehiculos.filter(v=>v.estado==='inmovilizado');
  return `<div class="card"><h3>Vehículos (PESV)</h3>
    <div class="kpis"><div class="kpi k-ok"><b>${S.vehiculos.length-sin.length-inm.length}</b><span>Con preoperacional hoy</span></div><div class="kpi k-warn"><b>${sin.length}</b><span>Sin preoperacional hoy</span></div><div class="kpi k-bad"><b>${inm.length}</b><span>Inmovilizados</span></div></div>
    ${alerts.length?`<div class="hist">${alerts.map(a=>`<button data-pv="${a.v?'vedit':'lista'}" data-placa="${a.v?a.v.placa:''}"><span>${a.v?`<b class="code" style="color:var(--azul)">${a.v.placa}</b> · ${a.d.l}`:`Conductor ${esc(a.c.nombre)}`}</span><span class="pill ${a.s.k}">${esc(a.s.l)}</span></button>`).join('')}</div>`:'<div class="okbox">Documentos de vehículos y licencias al día.</div>'}</div>`;
}

/* --- firma --- */
function signPre(){const d=PD();signTo('Conductor: '+(d.nombre||''),u=>{d.firma=u},d.cedula)}

/* --- eventos --- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-pv]');if(!b)return;const a=b.dataset.pv;
  if(a==='lista'){ui.view='vlista';render()}
  else if(a==='vnew'){ui.vf={isNew:true,placa:'',tipo:'Camioneta',marca:'',linea:'',modelo:'',color:'',km:'',estado:'operativo',docs:{}};ui.view='vform';render()}
  else if(a==='vedit'){const v=VEH(b.dataset.placa);ui.vf={...v,docs:{...v.docs},isNew:false};ui.view='vform';render()}
  else if(a==='vsave'){const f=ui.vf;f.placa=(f.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(!f.placa){toast('Escribe la placa');return}if(f.isNew&&VEH(f.placa)){toast('Esa placa ya está registrada');return}
    const{isNew,...data}=f;data.km=+data.km||0;if(isNew)S.vehiculos.push(data);else Object.assign(VEH(f.placa),data);save();ui.view='vlista';render();toast('Vehículo guardado')}
  else if(a==='pnew'){const v=VEH(b.dataset.placa),l=lastPre(v.placa),me=S.user&&COND(S.user.cedula);const c=me||(l&&COND(l.cedula));
    S.pdraft={id:'v'+Date.now(),placa:v.placa,fecha:today(),hora:new Date().toTimeString().slice(0,5),cedula:c?c.cedula:(S.user?S.user.cedula:''),nombre:c?c.nombre:(S.user?S.user.nombre:''),cat:'',licVence:'',km:'',checks:{},obsItems:{},foto:'',obs:'',firma:'',recordar:true};
    ui.step=0;ui.pedit=null;ui.view='preop';save();render()}
  else if(a==='pnext'){ui.step++;ui.pedit=null;render()}
  else if(a==='pprev'){ui.step--;render()}
  else if(a==='pgoto'){ui.step=+b.dataset.step;render()}
  else if(a==='pedit')keep(()=>{ui.pedit=b.dataset.k});
  else if(a==='pedit-ok')keep(()=>{ui.pedit=null;save()});
  else if(a==='botiquin-hoy')keep(()=>{VEH(PD().placa).docs.botiquin=today();save();toast('Botiquín revisado hoy. Próxima revisión en 6 meses.')});
  else if(a==='gok')keep(()=>{const d=PD(),v=VEH(d.placa),g=VGROUPS.find(x=>x.k===b.dataset.g);gItems(v,g).forEach(it=>{if(!d.checks[it.k])d.checks[it.k]='c'});save()});
  else if(a==='tog')keep(()=>{const d=PD(),k=b.dataset.k;d.checks[k]=d.checks[k]==='nc'?'c':'nc';save()});
  else if(a==='psign')signPre();
  else if(a==='usefirma')keep(()=>{const d=PD();d.firma=regGet(d.cedula);save()});
  else if(a==='psave'){const d=PD(),v=VEH(d.placa);if(preIssues().length)return;const r=preResult();
    let c=COND(d.cedula);if(!c){c={cedula:d.cedula,nombre:d.nombre,cat:d.cat,licVence:d.licVence,firma:''};S.conductores.push(c)}
    const rec={...d,km:+d.km,resultado:r.apto?'apto':'noapto',motivos:r.motivos,lic:`${c.cat||''} · vence ${c.licVence||''}`,
      docsSnap:DOCS.filter(dd=>!(isMoto(v)&&(dd.k==='extintor'||dd.k==='botiquin'))).map(dd=>{const s=docState(v,dd);return{l:dd.l,f:docDue(v,dd)||'',k:s.k}})};
    S.preops.push(rec);v.km=+d.km;v.estado=r.apto?'operativo':'inmovilizado';S.pdraft=null;save();ui.pre=rec.id;ui.view='predoc';render();toast(r.apto?'Preoperacional guardado: apto':'Preoperacional guardado: vehículo inmovilizado')}
  else if(a==='open-pre'){ui.pre=b.dataset.id;ui.view='predoc';render()}
});
document.addEventListener('input',ev=>{
  const t=ev.target,dd=t.dataset;
  if(dd.vf){ui.vf[dd.vf]=t.value;return}
  if(dd.vfd){ui.vf.docs[dd.vfd]=t.value;return}
  const d=PD();if(!d)return;
  if(dd.pd){d[dd.pd]=t.value;if(dd.pd==='cedula'){const c=COND(t.value.trim());if(c){d.nombre=c.nombre;save();keep();const n=$('#pd-ced');n.focus();n.setSelectionRange(t.value.length,t.value.length);return}}}
  else if(dd.pobs)d.obsItems[dd.pobs]=t.value;
  else if(dd.pe){VEH(d.placa).docs[dd.pe]=t.value}
  else return;save();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='pd-foto'&&t.files[0])resizePhoto(t.files[0],u=>{PD().foto=u;save();keep();toast('Foto agregada')});
  if(t.dataset.pe)keep();
});
if(ui.view==='home')render();
</script>
